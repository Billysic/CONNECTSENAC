<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Docente - Connect Senac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .navbar-brand {
            font-weight: 700;
        }

        .section-title {
            color: #004a8d;
            font-weight: 700;
        }

        .accordion-button:not(.collapsed) {
            background-color: #e9f2fa;
            color: #004a8d;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #004a8d;">
        <div class="container">
            <a class="navbar-brand" href="#">Connect Senac <span class="badge bg-light text-dark ms-2">Área do
                    Professor</span></a>
            <a href="painel.html" class="btn btn-sm btn-outline-warning me-2 fw-bold">👁️ Ver Visão do Modelo</a>
            <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
        </div>
    </nav>

    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="section-title">👨‍🏫 As Minhas Turmas e Listas de Modelos</h4>
            <span class="text-muted small">Ligado como: <strong id="nomeProf">--</strong></span>
        </div>

        <div class="accordion shadow-sm" id="accordionTurmas">
            <div class="text-center text-muted p-5">A carregar a pauta de presenças...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/profissional.js"></script>
</body>

</html>
