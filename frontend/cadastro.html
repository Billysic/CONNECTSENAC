<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Senac | Cadastro de Modelo Voluntário</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            senac: {
              blue: '#004a8d',
              'blue-dark': '#002d57',
              'blue-light': '#e6f0fa',
              orange: '#f29100',
              'orange-dark': '#d97706',
              'orange-light': '#fff8eb'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4 sm:p-6 antialiased selection:bg-orange-100 selection:text-orange-900">

  <div class="max-w-lg w-full">
    <!-- Card de Cadastro -->
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-100 animate-fade-in relative overflow-hidden">
      <!-- Glow Decorativo -->
      <div class="absolute -top-16 -right-16 w-36 h-36 bg-gradient-to-br from-senac-orange/20 to-senac-blue/20 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Cabeçalho -->
      <div class="text-center space-y-2 mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-senac-blue text-white shadow-md shadow-blue-900/20 mb-1">
          <span class="font-extrabold text-xl tracking-wider">S</span>
          <div class="w-1.5 h-1.5 bg-senac-orange rounded-full ml-0.5"></div>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Criar Conta no Connect Senac</h1>
        <p class="text-xs text-slate-500">Cadastre-se para participar como modelo voluntário nas aulas práticas</p>
      </div>

      <!-- Formulário de Registro -->
      <form id="formCadastro" class="space-y-4">
        <div>
          <label for="nome" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Nome Completo</label>
          <div class="relative">
            <i data-lucide="user" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="nome" required placeholder="Seu nome e sobrenome" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-senac-blue focus:border-transparent transition-all bg-slate-50/50">
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">E-mail</label>
            <div class="relative">
              <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="email" id="email" required placeholder="seu@email.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-senac-blue focus:border-transparent transition-all bg-slate-50/50">
            </div>
          </div>

          <div>
            <label for="telefone" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">WhatsApp / Celular</label>
            <div class="relative">
              <i data-lucide="phone" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="tel" id="telefone" required placeholder="(11) 98888-8888" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-senac-blue focus:border-transparent transition-all bg-slate-50/50">
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="senha" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Palavra-passe</label>
            <div class="relative">
              <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="password" id="senha" required placeholder="Mínimo 6 dígitos" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-senac-blue focus:border-transparent transition-all bg-slate-50/50">
            </div>
          </div>

          <div>
            <label for="confirmar_senha" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">Confirmar Palavra-passe</label>
            <div class="relative">
              <i data-lucide="shield-check" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="password" id="confirmar_senha" required placeholder="Repita a senha" class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-senac-blue focus:border-transparent transition-all bg-slate-50/50">
            </div>
          </div>
        </div>

        <!-- Termos LGPD -->
        <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-2.5 text-xs text-slate-700">
          <label class="flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" id="termoUso" required class="mt-0.5 rounded text-senac-blue focus:ring-senac-blue">
            <span>Li e aceito os <strong>Termos de Uso</strong> e confirmo estar ciente de que os procedimentos são executados por alunos sob orientação docente (LGPD).</span>
          </label>
          <label class="flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" id="termoImagem" class="mt-0.5 rounded text-senac-blue focus:ring-senac-blue">
            <span>Autorizo o registro de imagem (fotos/vídeos) estritamente para avaliação pedagógica do Senac.</span>
          </label>
        </div>

        <!-- Mensagens de Feedback -->
        <div id="mensagemCadastro" class="text-xs"></div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-senac-blue hover:bg-senac-blue-dark text-white font-bold text-sm transition-all shadow-md shadow-blue-900/10 flex items-center justify-center gap-2">
          <span>Cadastrar e Começar</span>
          <i data-lucide="check" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Link para Login -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-500">
          Já possui cadastro? 
          <a href="index.html" class="font-bold text-senac-blue hover:text-senac-blue-dark transition-colors">Acesse aqui sua conta</a>
        </p>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
