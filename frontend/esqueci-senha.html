<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect Senac | Recuperar Palavra-passe</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            senac: {
              blue: '#004a8d',
              'blue-dark': '#002d57',
              'blue-light': '#e6f0fa',
              orange: '#f29100',
              'orange-dark': '#d97706',
              'orange-light': '#fff8eb'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center p-4 sm:p-6 antialiased selection:bg-orange-100 selection:text-orange-900">

  <div class="max-w-md w-full">
    <div class="bg-white rounded-3xl p-8 sm:p-10 shadow-xl border border-slate-100 animate-fade-in relative overflow-hidden">
      
      <!-- Cabeçalho -->
      <div class="text-center space-y-2 mb-6">
        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 border border-amber-200/60 mb-2">
          <i data-lucide="key-round" class="w-6 h-6"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Recuperar Palavra-passe</h1>
        <p class="text-xs text-slate-500">Informe seu e-mail cadastrado para receber as instruções de recuperação.</p>
      </div>

      <!-- Formulário -->
      <form id="formEsqueci" class="space-y-4">
        <div>
          <label for="emailRecuperacao" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1.5">E-mail Cadastrado</label>
          <div class="relative">
            <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="email" id="emailRecuperacao" required placeholder="seu.email@exemplo.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-senac-blue focus:border-transparent transition-all bg-slate-50/50">
          </div>
        </div>

        <div id="msgRecuperacao" class="text-xs"></div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-senac-blue hover:bg-senac-blue-dark text-white font-bold text-sm transition-all shadow-md shadow-blue-900/10 flex items-center justify-center gap-2">
          <span>Enviar Link de Recuperação</span>
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>

      <div class="mt-8 pt-6 border-t border-slate-100 text-center">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-bold text-senac-blue hover:text-senac-blue-dark transition-colors">
          <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
          <span>Voltar para o Login</span>
        </a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    lucide.createIcons();
  </script>
</body>
</html>
